# Production Compose for the Aristotle agent API on the Workspace VPS.
# Derived from workspace-infra/templates/compose.production.yaml.
# Run from /opt/workspace/apps/aristotle-api with APP_SOURCE_ROOT, APP_ENV_FILE,
# and APP_IMAGE_TAG supplied by the server-side deploy script.
name: aristotle-api

services:
  backend:
    build:
      context: ${APP_SOURCE_ROOT:-./source}/api
    image: aristotle-api-backend:${APP_IMAGE_TAG:-local}
    container_name: workspace-aristotle-api
    env_file:
      - ${APP_ENV_FILE:-./.env}
    expose:
      - "7860"
    networks:
      - gateway   # Caddy + reaching workspace-aristotle-search
      - data      # shared workspace-postgres
      - internal  # private link to the sandbox service
    volumes:
      # Uploads live on disk (metadata is in Postgres); persist them so
      # download links survive restarts and Sablier sleep.
      - aristotle_storage:/app/storage
    labels:
      sablier.enable: "true"
      # Join search's existing Sablier group so the API's route wakes both
      # containers; the API then reaches search over the internal network
      # (ARISTOTLE_SEARCH_BASE_URL=http://workspace-aristotle-search:7860)
      # without a public hop. The group is named for search (it predates the
      # API) — the name is cosmetic; what matters is that both share it.
      sablier.group: aristotle-search
    # /healthz is process liveness (returns ok unconditionally). Model/search
    # readiness is enforced per-request by the agent's wake loop, and /readyz
    # makes external calls — so it is kept out of the Docker health check.
    # The API image has no curl, so probe with the base image's python3 + stdlib.
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/healthz').read()
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 2g
    cpus: "2.0"
    security_opt:
      - no-new-privileges:true

  # Headless durable executor. It owns DBOS queue consumption and agent/tool
  # work; the HTTP service only creates runs and serves their persisted events.
  worker:
    build:
      context: ${APP_SOURCE_ROOT:-./source}/api
    image: aristotle-api-backend:${APP_IMAGE_TAG:-local}
    container_name: workspace-aristotle-worker
    command: ["uv", "run", "--frozen", "python", "-m", "app.worker"]
    env_file:
      - ${APP_ENV_FILE:-./.env}
    environment:
      # The API request wakes the shared Sablier group before queueing the run;
      # keep worker-to-search traffic on the shared gateway network.
      ARISTOTLE_SEARCH_BASE_URL: http://workspace-aristotle-search:7860
    networks:
      - gateway
      - data
      - internal
    volumes:
      - aristotle_storage:/app/storage
    healthcheck:
      test: ["CMD", "python3", "-c", "from pathlib import Path; assert Path('/tmp/aristotle-worker-ready').exists()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 2g
    cpus: "2.0"
    security_opt:
      - no-new-privileges:true

  # The only component that runs untrusted, agent-written code. It joins ONLY
  # the private internal network (no public edge, no Postgres, no other project),
  # so a breakout is boxed into a resource-capped container with nothing valuable
  # reachable. Holds no secrets beyond the shared auth token.
  sandbox:
    build:
      context: ${APP_SOURCE_ROOT:-./source}/sandbox
    image: aristotle-sandbox:${APP_IMAGE_TAG:-local}
    container_name: workspace-aristotle-sandbox
    environment:
      # Only the shared token is injected — deliberately not the API's env_file,
      # so DB and model credentials never reach the code-execution container.
      SANDBOX_AUTH_TOKEN: ${SANDBOX_AUTH_TOKEN:-}
      SANDBOX_WORKSPACE_ROOT: /workspace
    networks:
      - internal
    volumes:
      - aristotle_workspace_data:/workspace
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/healthz').read()
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 2g
    cpus: "1.5"
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  gateway:
    name: workspace_gateway
    external: true
  data:
    name: workspace_data
    external: true
  # App-private link between the API and the sandbox. internal:true = no route
  # to the internet or other project networks.
  internal:
    name: aristotle_internal
    internal: true

volumes:
  aristotle_storage:
    name: aristotle_storage
  aristotle_workspace_data:
    name: aristotle_workspace_data
